[package]
name = "margin-study"
version = "0.2.0"
description = "A small local study journal"
authors = ["Margin contributors"]
edition = "2021"
license = "MIT"
rust-version = "1.90"

[lib]
name = "margin_study_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
tempfile = "3"

[dev-dependencies]

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
